<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuevo producto</title>

  <link rel="stylesheet" href="../css/tablas.css">
  <link rel="stylesheet" href="../css/topbar_menu.css">



  <script src="../js/sesiones.js"></script>
  <script src="../js/componentes/menu.js" defer></script>
  <script src="../js/componentes/topbar.js" defer></script>
  <script src="../js/añadir_producto.js" defer></script>

</head>
<body>
<div class="container">
    <aside class="sidebar"></aside> <!-- Aquí va el menú -->

    <main class="main-content">
  <header class="topbar"></header>

  <section class="welcome">


     <h1>Registro de Productos</h1>

      <div class="botones-acciones">
            <a href="inventario.html"><button>⏪ Regresar</button></a>
      </div>

      <form id="formulario">

          <label>Coloque proveedor</label><br>
          <select id="proveedores"></select><br><br>

          <label>Coloque nombre</label><br>
          <input type="text" id="nombre"><br><br>

          <label>Coloque descripción</label><br>
          <input type="text" id="descripcion"><br><br>

          <label>Coloque precio</label><br>
          <input type="number" id="precio" min="0"><br><br>

          <label>Coloque porcentaje de ganancia %</label><br>
          <input type="number" max="35" id="porcentaje"><br><br>

          <label>Coloque categoria</label><br>
          <select id="categorias"></select><br><br>

          <label>Coloque talla</label><br>
          <select id="tallas"></select><br><br>

          <input type="submit" value="Registrar" class="btn blue">
        </form>
  </section>
</main>

  </div>

</body>
</html>
