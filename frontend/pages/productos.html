<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Productos - ModaSoft</title>
  <link rel="stylesheet" href="../css/topbar_menu.css">
<link rel="stylesheet" href="../css/productos.css">

  <script src="../js/sesiones.js"></script>
  <script src="../js/componentes/menu.js" defer></script>
  <script src="../js/componentes/topbar.js" defer></script>
  <script src="../js/productos.js" defer></script> <!-- si tienes lógica para cargar datos -->
</head>
<body>
  <div class="container">
    <aside class="sidebar"></aside> <!-- Aquí va el menú -->

    <main class="main-content">
      <header class="topbar"></header>

        <section class="welcome">
        <h1>Gestión de Productos</h1>
        <div class="botones-acciones">
          <button class="btn blue" onclick="irAFormulario()">➕ Nuevo producto</button>
          <button class="btn purple" onclick="mostrarFormularioTalla()">➕ Añadir talla</button>
        </div>
 

        <table id="tabla">
          <thead>
            <tr>
            <th>Nombre</th>
            <th>Descripción</th>
            <th>Precio C/U</th>
            <th>Categoría</th>
            <th>Talla</th>
            <th>Opciones</th>
          </tr>
        </thead>
        <tbody id="datos"></tbody>
        </table>
      </section>
    </main>

  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      new MenuComponent().mount();
      new TopbarComponent().mount();
      cargarProductos(); // ¡Este es esencial!
    });
  </script>
</body>
</html>
