<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Compra</title>
    <link rel="stylesheet" href="../css/topbar_menu.css">
    <!-- <link rel="stylesheet" href="../css/tablas.css"> -->

    <script src="../js/sesiones.js"></script>
    <script src="../js/componentes/menu.js" defer></script>
    <script src="../js/componentes/topbar.js" defer></script>
    <script src="../js/añadir_compra.js"></script>

</head>
<body>
    <div class="container">
      <aside class="sidebar"></aside> <!-- Aquí va el menú -->

      <main class="main-content">
        <header class="topbar"></header>

        <section class="welcome">
          <h1>Nueva orden de compra</h1>
          <div class="botones-acciones">
            <a href="añadir_compra.html"><button>➕ Nueva compra</button></a>
          </div>

          <form id="formulario" action="">

        <label>Seleccione fecha despacho</label>
        <input type="date" id="fecha_vence"><br>

        <label>Seleccione proveedor</label>
        <select id="proveedores"></select><br>

        <label for="">Seleccion productos</label>

        <label>Cantidad total: <div id="total-general">0.00</div></label>
        
        <table id="tabla">
        
            <thead>
                <th>Productos</th>
                <th>Cantidad</th>
                <th>Precio</th>
                <th>Opciones</th>
            </thead>

            <tbody class="cont-productos">

                <tr class="producto">
                    <td>
                        <select class="select-productos" data-precio></select>
                    </td>
                    <td>
                        <input class="cantidad" type="number" value="1" min="1">
                    </td>
                    <td>
                       <div class="subtotal">0.00</div>
                    </td>
                    <td>
                        <button class="eliminar" disabled>🗑</button>
                    </td>
                </tr>

            </tbody>

        </table>

    </form>

    <button id="agregar-producto"><span>➕</span></button><br>

    <button id="btn-registrar">Registrar</button><br>

    <a href="compras.html"><button>Atrás</button></a>

        </section>
      </main>

  </div>

</body>
</html>
