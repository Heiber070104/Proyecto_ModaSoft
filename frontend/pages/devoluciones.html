<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Módulo de Devoluciones</title>
  <link rel="stylesheet" href="../css/topbar_menu.css">
  <link rel="stylesheet" href="../css/tablas.css">
  <link rel="icon" href="../public/logo_modasoft.png">
  <script src="../js/sesiones.js"></script>
  <script src="../../node_modules/sweetalert2/dist/sweetalert2.all.js"></script>
  <script src="../js/componentes/menu.js" defer></script>
  <script src="../js/componentes/topbar.js" defer></script>
  <script src="../js/devoluciones.js" defer></script>
</head>
<body>
  <div class="container">
    <aside class="sidebar"></aside>
    <main class="main-content">
      <header class="topbar"></header>

      <section class="welcome">
        <h1>Gestión de Devoluciones</h1>
<a href="reporte_devoluciones.html">
  <button id="btn-reporte-devoluciones" style="margin-bottom: 1rem;">📊 Ver reporte gráfico</button>
</a>

        <!-- Buscar devolución por factura -->
        <div class="busqueda-factura">
          <label for="inputFactura">Verifique si la factura existe para la devolucion</label>
          <input type="text" id="inputFactura" placeholder="Ej: F-001" />
          <button id="btnBuscar">🔍 Buscar</button>
          <p id="mensaje" class="mensaje-error"></p>
        </div>
        <table id="tabla-devoluciones">
  <thead>
    <tr>
      <th>Factura</th>
      <th>Cliente</th>
      <th>Producto</th>
      <th>Motivo</th>
      <th>Cantidad</th>
      <th>Fecha</th>
      <th>Estado</th>
      <th>Acción</th>
    </tr>
  </thead>
  <tbody class="cuerpo-tabla-devoluciones">
    <!-- JS llenará esta parte -->
  </tbody>
</table>
      </section>
    </main>
  </div>
</body>
</html>
