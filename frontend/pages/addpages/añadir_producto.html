<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuevo producto</title>
  <link rel="stylesheet" href="../css/topbar_menu.css">
  <link rel="stylesheet" href="../css/productos.css">
  <script src="../js/sesiones.js"></script>
  <script src="../js/componentes/menu.js" defer></script>
  <script src="../js/componentes/topbar.js" defer></script>
  <script src="../../js/addpages/añadir_producto.js" defer></script>
</head>
<body>
<div class="container">
    <aside class="sidebar"></aside> <!-- Aquí va el menú -->

    <main class="main-content">
  <header class="topbar"></header>

  <section class="welcome">
    <h1>Registro de Productos</h1>
 <form id="formulario" style="max-width: 500px; width: 100%; display: flex; flex-direction: column; gap: 15px; margin-top: 20px;">
          <label>Coloque nombre</label>
          <input type="text" id="nombre">

          <label>Coloque descripción</label>
          <input type="text" id="descripcion">

          <label>Coloque precio</label>
          <input type="number" id="precio">

          <label>Coloque categoría</label>
          <select id="categoria"></select>

          <label>Coloque talla</label>
          <select id="talla"></select>

          <label>Coloque cantidad</label>
          <input type="number" id="cantidad">

          <input type="submit" value="Registrar" class="btn blue">
        </form>
        
  </section>
</main>

  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      new MenuComponent().mount();
      new TopbarComponent().mount();
    });
  </script>
</body>
</html>
