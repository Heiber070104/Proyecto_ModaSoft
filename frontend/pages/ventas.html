<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ventas</title>
    <link rel="stylesheet" href="../css/topbar_menu.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/tablas.css">

    <link rel="stylesheet" href="../css/acciones.css">


    <link rel="icon" href="../public/logo_modasoft.png">
    <script src="../js/sesiones.js"></script>
    <script src="../../node_modules/sweetalert2/dist/sweetalert2.all.js"></script>
    <script src="../js/componentes/loader.js" defer></script>
    <script src="../js/componentes/menu.js" defer></script>
    <script src="../js/componentes/topbar.js" defer></script>

    <script src="../js/ventas.js"></script>

</head>
<body>

  <div class="container">
    <aside class="sidebar"></aside>

    <main class="main-content">
      <header class="topbar"></header>


      <section class="welcome">
        <h1>Gestión de Ventas</h1>

        <div class="filtro-horizontal">
          <label for="tipoBusqueda">Buscar por:</label>
            <select id="tipoBusqueda">
              <option value="">Seleccione una opción</option>
              <option value="fecha">Rango de fecha</option>
              <option value="estado">Estado</option>
         <!-- <option value="cliente">Cliente</option> -->
            </select>
        </div>

        <div id="inputsDinamicos" style="margin-bottom: 1rem;"></div>

       <div class="botones-filtro">
            <button id="btnBuscar">🔍 Buscar</button>
             <button id="btnLimpiar">🧹 Limpiar</button>
       </div>


        <div class="botones-acciones">
          <a href="añadir_venta.html"><button>➕ Nueva venta</button></a>
        </div>

        <table class="tablaVentas">
          <thead>
            <tr>
                <th>N° de venta</th>
                <th>N° Factura</th>
                <th>Fecha creado</th>
                <th>Cliente</th>
                <th>Total</th>
                <th>Tipo de pago</th>
                <th>Estado</th>
                <th>Detalles de venta</th>     
                <th class="rol">Acciones</th>     

            </tr>
          </thead>
          <tbody class="cont-ventas"></tbody>
        </table>

      </section>
    </main>
  </div>

  <script src="../js/ventas.js"></script>
</body>
</html>
