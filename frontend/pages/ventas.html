<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ventas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 2rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 0.5rem 1rem;
            text-align: left;
        }
        th {
            background-color: #f5f5f5;
        }
        tr:hover {
            background-color: #eaeaea;
        }
        #mensajeError, #mensajeExito {
            margin-top: 1rem;
            padding: 0.5rem;
            display: none;
        }
        #mensajeError {
            color: white;
            background-color: #d9534f;
        }
        #mensajeExito {
            color: white;
            background-color: #5cb85c;
        }
        form > div {
            margin-bottom: 0.8rem;
        }
        label {
            display: block;
            margin-bottom: 0.2rem;
        }
        input[type="text"], input[type="date"], input[type="number"] {
            width: 100%;
            padding: 0.4rem;
            box-sizing: border-box;
        }
        button {
            padding: 0.6rem 1.2rem;
            background-color: #0275d8;
            border: none;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #025aa5;
        }
    </style>
</head>
<body>
    <h1>Registrar Nueva Venta</h1>
    <form id="formVenta">
        <div>
            <label for="fecha">Fecha:</label>
            <input type="date" id="fecha" name="fecha" required />
        </div>
        <div>
            <label for="id_cliente">ID Cliente:</label>
            <input type="number" id="id_cliente" name="id_cliente" required min="1" />
        </div>
        <div>
            <label for="total">Total:</label>
            <input type="number" step="0.01" id="total" name="total" required min="0" />
        </div>
        <div>
            <label for="estado">Estado:</label>
            <input type="text" id="estado" name="estado" required maxlength="50" />
        </div>
        <button type="submit">Registrar Venta</button>
    </form>

    <div id="mensajeError"></div>
    <div id="mensajeExito"></div>

    <h1>Listado de Ventas</h1>
    <table id="tablaVentas">
        <thead>
            <tr>
                <th>ID Venta</th>
                <th>Fecha</th>
                <th>ID Cliente</th>
                <th>Total</th>
                <th>Estado</th>
            </tr>
        </thead>
        <tbody>
            <!-- Filas con ventas -->
        </tbody>
    </table>

    <script>
        const urlVentas = 'http://127.0.0.1:8000/venta';

        // Función para cargar todas las ventas y mostrar en tabla
        function cargarVentas() {
            const tbody = document.querySelector('#tablaVentas tbody');
            tbody.innerHTML = '';

            fetch(urlVentas)
                .then(res => {
                    if (!res.ok) throw new Error('Error al cargar ventas');
                    return res.json();
                })
                .then(ventas => {
                    if (!Array.isArray(ventas) || ventas.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="5">No hay ventas registradas</td></tr>';
                        return;
                    }

                    ventas.forEach(venta => {
                        const fila = document.createElement('tr');
                        fila.innerHTML = `
                            <td>${venta.id_venta}</td>
                            <td>${venta.fecha}</td>
                            <td>${venta.id_cliente}</td>
                            <td>${venta.total}</td>
                            <td>${venta.estado}</td>
                        `;
                        tbody.appendChild(fila);
                    });
                })
                .catch(error => {
                    console.error(error);
                    tbody.innerHTML = '<tr><td colspan="5">Error al cargar ventas</td></tr>';
                });
        }

        document.addEventListener('DOMContentLoaded', () => {
            cargarVentas();

            const form = document.getElementById('formVenta');
            const mensajeError = document.getElementById('mensajeError');
            const mensajeExito = document.getElementById('mensajeExito');

            form.addEventListener('submit', e => {
                e.preventDefault();
                mensajeError.style.display = 'none';
                mensajeExito.style.display = 'none';

                const formData = new FormData(form);
                const data = Object.fromEntries(formData.entries());

                // Convertir algunos campos a tipos correctos
                data.id_cliente = parseInt(data.id_cliente);
                data.total = parseFloat(data.total);

                fetch(urlVentas, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data),
                })
                    .then(res => {
                        if (!res.ok) return res.json().then(err => { throw err; });
                        return res.json();
                    })
                    .then(resData => {
                        mensajeExito.textContent = resData.mensaje || 'Venta registrada con éxito';
                        mensajeExito.style.display = 'block';
                        form.reset();
                        cargarVentas();
                    })
                    .catch(err => {
                        console.error(err);
                        mensajeError.textContent = err.message || 'Error al registrar la venta';
                        if (err.errors) {
                            // Mostrar errores de validación de Laravel
                            const mensajes = Object.values(err.errors).flat().join('; ');
                            mensajeError.textContent += ': ' + mensajes;
                        }
                        mensajeError.style.display = 'block';
                    });
            });
        });
    </script>
</body>
</html>
