<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/topbar_menu.css">
    <link rel="stylesheet" href="../css/tablas.css">
    <title>Tallas</title>
    <script src="../js/sesiones.js"></script>
    <script src="../js/componentes/menu.js" defer></script>
    <script src="../js/componentes/topbar.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div class="container">
      <aside class="sidebar"></aside> <!-- Aquí va el menú -->

    <main class="main-content">
    <header class="topbar"></header>

    <section class="welcome">
        

    <div style="width: 500px; height: 500px;">
        <canvas id="myChart"></canvas>
    </div>

    <script>

        var nombres = [];
        var valores = [];

        const productosMasVendidos = async () => {

            try{
                const res = await fetch("http://localhost:8000/ventas/productosMasVendidos")
                

                const consulta = await res.json();

                if(res.ok){

                    Object.values(consulta).forEach(producto => {

                        nombres.push(`${producto.nombre} - ${producto.talla}`)
                        valores.push(producto.cantidad)

                    })

                    const ctx = document.getElementById('myChart');
        const myChart = new Chart(ctx, {
            type: 'pie',
            data: {
                labels: nombres,
                datasets: [{
                    label: 'N° de ventas totales',
                    data: valores,
                    backgroundColor: [
                        'rgba(255, 99, 132, 0.2)',
                        'rgba(54, 162, 235, 0.2)',
                        'rgba(255, 206, 86, 0.2)',
                        'rgba(75, 192, 192, 0.2)',
                        'rgba(153, 102, 255, 0.2)',
                        'rgba(255, 159, 64, 0.2)'
                    ],
                    borderColor: [
                        'rgba(255, 99, 132, 1)',
                        'rgba(54, 162, 235, 1)',
                        'rgba(255, 206, 86, 1)',
                        'rgba(75, 192, 192, 1)',
                        'rgba(153, 102, 255, 1)',
                        'rgba(255, 159, 64, 1)'
                    ],
                    borderWidth: 1
                }]
            },
            options: {
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });

                }
            }catch(e){
                console.log(e)
            }

        }

        productosMasVendidos();
        // console.log(valores + nombres)

        
    </script>


        </section>

      </main>

  </div>
        
</body>

</html>
