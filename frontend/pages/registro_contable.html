<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario de Ropa</title>
    <link rel="stylesheet" href="../css/topbar_menu.css">
    <link rel="stylesheet" href="../css/tablas.css">
    <link rel="icon" href="../public/logo_modasoft.png">
    <script src="../js/sesiones.js"></script>
    <script src="../js/componentes/menu.js" defer></script>
    <script src="../js/componentes/topbar.js" defer></script>
</head>
<body>
     <div class="container">
      <aside class="sidebar"></aside> <!-- Aquí va el menú -->

      <main class="main-content">
        <header class="topbar"></header>

        <section class="welcome">
    <h1>Registrar Transacción Contable</h1>
    <form id="registroContableForm">
        <label for="fecha">Fecha:</label>
        <input type="date" id="fecha" required>

        <label for="id_cuenta">Cuenta Contable:</label>
        <select id="id_cuenta" required>
            <!-- Las opciones se llenarán desde JS -->
        </select>

        <label for="monto">Monto:</label>
        <input type="number" id="monto" step="0.01" required>

        <label for="tipo">Tipo de Transacción:</label>
        <select id="tipo" required>
            <option value="DEBITO">Débito</option>
            <option value="CREDITO">Crédito</option>
        </select>

        <button type="submit">Registrar</button>
    </form>
    </section>
    </main>
</div>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/frontend/js/registro_contable.js"></script>
</body>
</html>
