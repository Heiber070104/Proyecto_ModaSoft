<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>ModaSoft - Dashboard</title>
  <link rel="stylesheet" href="../css/topbar_menu.css">
  <script src="../js/sesiones.js"></script>
  <script src="../js/componentes/menu.js" defer></script>
  <script src="../js/componentes/topbar.js" defer></script>
  <script src="../js/dashboard.js" defer></script>
</head>
<body>
  <div class="container">
    <aside class="sidebar"></aside> <!-- Aquí se insertará el menú -->
    
    <main class="main-content">
      <header class="topbar"></header> <!-- Aquí se insertará el topbar -->
      
      <section class="welcome">
        <h1>Bienvenido al sistema <br> <strong>ModaSoft</strong></h1>
        <div class="actions">
          <button class="btn blue" onclick="cambiarPagina('inventario.html')">📦 Ir a Inventario</button>
          <button class="btn blue">📊 Ver Reportes</button>
          <button class="btn blue">💰 Registrar venta</button>
        </div>
      </section>
    </main>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      new MenuComponent().mount();
      new TopbarComponent().mount();
    });
  </script>
</body>
</html>
